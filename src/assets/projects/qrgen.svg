<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="QR Generator illustration">
  <!-- QR Code grid -->
  <g transform="translate(150, 30)" opacity="0.8">
    <!-- Top-left finder -->
    <rect x="0" y="0" width="42" height="42" rx="4" fill="none" stroke="#4a9eff" stroke-width="2"/>
    <rect x="8" y="8" width="26" height="26" rx="2" fill="none" stroke="#4a9eff" stroke-width="2"/>
    <rect x="14" y="14" width="14" height="14" rx="1" fill="#4a9eff"/>
    <!-- Top-right finder -->
    <rect x="58" y="0" width="42" height="42" rx="4" fill="none" stroke="#4a9eff" stroke-width="2"/>
    <rect x="66" y="8" width="26" height="26" rx="2" fill="none" stroke="#4a9eff" stroke-width="2"/>
    <rect x="72" y="14" width="14" height="14" rx="1" fill="#4a9eff"/>
    <!-- Bottom-left finder -->
    <rect x="0" y="58" width="42" height="42" rx="4" fill="none" stroke="#4a9eff" stroke-width="2"/>
    <rect x="8" y="66" width="26" height="26" rx="2" fill="none" stroke="#4a9eff" stroke-width="2"/>
    <rect x="14" y="72" width="14" height="14" rx="1" fill="#4a9eff"/>
    <!-- Data modules -->
    <rect x="58" y="58" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.6"/>
    <rect x="74" y="58" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.4"/>
    <rect x="90" y="58" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.7"/>
    <rect x="58" y="74" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.5"/>
    <rect x="74" y="74" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.8"/>
    <rect x="90" y="74" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.3"/>
    <rect x="58" y="90" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.6"/>
    <rect x="74" y="90" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.5"/>
    <rect x="90" y="90" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.7"/>
    <!-- Scattered data -->
    <rect x="8" y="58" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.3"/>
    <rect x="24" y="58" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.5"/>
    <rect x="40" y="58" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.4"/>
    <rect x="8" y="74" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.6"/>
    <rect x="24" y="90" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.3"/>
    <rect x="40" y="90" width="8" height="8" rx="1" fill="#4a9eff" opacity="0.5"/>
  </g>

  <!-- Terminal prompt -->
  <text x="40" y="170" font-family="monospace" font-size="11" fill="rgba(74,158,255,0.3)">$ qrgen "hello"</text>
  <!-- Unicode label -->
  <text x="280" y="170" font-family="monospace" font-size="11" fill="rgba(74,158,255,0.2)">Unicode ▮ ASCII #</text>
</svg>
