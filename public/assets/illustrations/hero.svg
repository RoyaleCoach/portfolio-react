<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Developer workspace illustration">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(74,158,255,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(74,158,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(74,158,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background grid -->
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Monitor frame -->
  <rect x="200" y="70" width="400" height="248" rx="10" fill="#161B22" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Monitor screen -->
  <rect x="214" y="84" width="372" height="218" rx="6" fill="#0D1117"/>
  <!-- Screen glow overlay -->
  <rect x="214" y="84" width="372" height="218" rx="6" fill="url(#screenGlow)"/>

  <!-- Screen content - code lines with improved visibility -->
  <rect x="240" y="108" width="140" height="8" rx="4" fill="#4a9eff" opacity="0.7"/>
  <rect x="240" y="126" width="240" height="5" rx="2.5" fill="rgba(255,255,255,0.25)"/>
  <rect x="264" y="140" width="200" height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>
  <rect x="264" y="154" width="220" height="5" rx="2.5" fill="rgba(74,158,255,0.45)"/>
  <rect x="264" y="168" width="170" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="240" y="186" width="100" height="8" rx="4" fill="#4ade80" opacity="0.55"/>
  <rect x="240" y="204" width="220" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="264" y="218" width="150" height="5" rx="2.5" fill="rgba(74,158,255,0.35)"/>
  <rect x="264" y="232" width="190" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
  <rect x="240" y="250" width="120" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>
  <rect x="264" y="264" width="170" height="5" rx="2.5" fill="rgba(74,158,255,0.3)"/>
  <rect x="264" y="278" width="140" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>

  <!-- Cursor blink -->
  <rect x="434" y="278" width="3" height="16" rx="1" fill="#4a9eff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Monitor stand -->
  <rect x="370" y="318" width="60" height="10" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="345" y="328" width="110" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>

  <!-- Floating elements — improved visibility -->
  <!-- Code bracket left -->
  <text x="110" y="195" font-family="monospace" font-size="72" fill="rgba(74,158,255,0.18)" font-weight="300">{ }</text>
  <!-- Angle brackets right -->
  <text x="660" y="200" font-family="monospace" font-size="48" fill="rgba(74,158,255,0.14)" font-weight="300">&lt;/&gt;</text>
  <!-- Binary decoration -->
  <text x="610" y="140" font-family="monospace" font-size="14" fill="rgba(74,158,255,0.14)">01001000 01101001</text>
  <text x="630" y="160" font-family="monospace" font-size="14" fill="rgba(74,158,255,0.1)">01001100 01101111</text>
  <text x="620" y="180" font-family="monospace" font-size="14" fill="rgba(74,158,255,0.08)">01010111 01101111</text>
  <!-- Terminal decoration -->
  <text x="640" y="230" font-family="monospace" font-size="13" fill="rgba(74,222,128,0.16)">$ ./run</text>
  <text x="640" y="248" font-family="monospace" font-size="13" fill="rgba(74,222,128,0.1)">> build complete</text>

  <!-- Glow orbs — larger and more visible -->
  <circle cx="690" cy="360" r="100" fill="url(#glow)"/>
  <circle cx="110" cy="390" r="75" fill="url(#glow)"/>
  <circle cx="400" cy="450" r="60" fill="url(#glow)"/>
</svg>
