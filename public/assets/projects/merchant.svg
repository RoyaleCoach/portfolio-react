<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5016"/>
      <stop offset="100%" style="stop-color:#1a3a0a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#sky)"/>
  <rect y="140" width="400" height="60" fill="url(#ground)"/>
  <!-- Castle -->
  <rect x="40" y="70" width="60" height="70" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
  <rect x="35" y="60" width="15" height="20" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
  <rect x="60" y="55" width="20" height="25" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
  <rect x="90" y="60" width="15" height="20" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
  <polygon points="35,60 42,45 50,60" fill="#a0522d"/>
  <polygon points="60,55 70,40 80,55" fill="#a0522d"/>
  <polygon points="90,60 97,45 105,60" fill="#a0522d"/>
  <rect x="65" y="100" width="12" height="18" fill="#4a3728"/>
  <!-- Market stalls -->
  <rect x="150" y="110" width="50" height="30" fill="#cd853f" stroke="#8b6914" stroke-width="1"/>
  <rect x="145" y="100" width="60" height="12" fill="#b22222"/>
  <polygon points="145,100 175,88 205,100" fill="#8b0000"/>
  <rect x="240" y="115" width="45" height="25" fill="#cd853f" stroke="#8b6914" stroke-width="1"/>
  <rect x="235" y="105" width="55" height="12" fill="#4169e1"/>
  <polygon points="235,105 262,93 290,105" fill="#2e4a8b"/>
  <!-- Coins -->
  <circle cx="165" cy="125" r="5" fill="#ffd700" stroke="#daa520" stroke-width="1"/>
  <text x="163" y="128" font-size="6" fill="#8b6914" font-weight="bold">$</text>
  <circle cx="255" cy="128" r="5" fill="#ffd700" stroke="#daa520" stroke-width="1"/>
  <text x="253" y="131" font-size="6" fill="#8b6914" font-weight="bold">$</text>
  <!-- Stars -->
  <circle cx="320" cy="30" r="1.5" fill="#fff"/>
  <circle cx="350" cy="50" r="1" fill="#fff"/>
  <circle cx="290" cy="25" r="1" fill="#fff"/>
  <circle cx="370" cy="35" r="1.5" fill="#fff"/>
  <circle cx="120" cy="20" r="1" fill="#fff"/>
  <!-- Moon -->
  <circle cx="340" cy="40" r="15" fill="#f0e68c"/>
  <circle cx="345" cy="37" r="13" fill="#1a1a2e"/>
  <!-- Banner text -->
  <text x="200" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#daa520" font-weight="bold">MEDIEVAL MARKET TYCOON</text>
</svg>
