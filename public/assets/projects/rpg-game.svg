<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="RPG Game illustration">
  <!-- Sword -->
  <line x1="180" y1="60" x2="180" y2="140" stroke="#4a9eff" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="75" x2="195" y2="75" stroke="#4a9eff" stroke-width="3" stroke-linecap="round"/>
  <line x1="176" y1="140" x2="184" y2="140" stroke="#4a9eff" stroke-width="3" stroke-linecap="round"/>

  <!-- Shield -->
  <path d="M220 65 L250 75 L250 110 L235 130 L220 110 Z" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.7"/>
  <path d="M230 85 L235 100 L238 90 L240 100 L245 85" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>

  <!-- HP Bar -->
  <rect x="100" y="160" width="80" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="100" y="160" width="55" height="8" rx="4" fill="#f87171" opacity="0.6"/>
  <text x="100" y="155" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.3)">HP</text>

  <!-- MP Bar -->
  <rect x="200" y="160" width="80" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="200" y="160" width="65" height="8" rx="4" fill="#4a9eff" opacity="0.6"/>
  <text x="200" y="155" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.3)">MP</text>

  <!-- Level badge -->
  <circle cx="320" cy="100" r="24" fill="none" stroke="rgba(74,158,255,0.2)" stroke-width="2"/>
  <text x="320" y="106" font-family="monospace" font-size="16" font-weight="700" fill="#4a9eff" text-anchor="middle">Lv</text>
</svg>
